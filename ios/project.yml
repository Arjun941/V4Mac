# muguet - project.yml
# Constantin Clerc (c22dev) - 0.1

name: V4Mac
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  V4Mac:
    type: application
    platform: iOS
    sources:
      - path: stub.c
      - path: ../assets/v4mac.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offspace.v4mac.ios
        PRODUCT_NAME: V4Mac
        EXECUTABLE_NAME: v4mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: V4Mac.entitlements
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: v4mac
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        DEBUG_INFORMATION_FORMAT: dwarf
    postBuildScripts:
      - name: Use the Rust executable
        basedOnDependencyAnalysis: false
        script: |
          set -e
          xcrun vtool -set-build-version ios 15.0 26.0 -replace -output "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" \
            "$SRCROOT/../target/ios/aarch64-apple-ios/release/v4mac"
